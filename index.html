<style>
:root{
  --bg:#0A0E15;--surface:#10161F;--surface-2:#141C27;--border:#1E2A38;
  --text:#E6EDF3;--dim:#8B9BB0;--accent:#4FD1C5;--accent-soft:rgba(79,209,197,.10);
  --star:#E8B54A;--radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.site-header{position:sticky;top:0;z-index:20;background:rgba(10,14,21,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-row{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border)}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand-sub{display:block;font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.16em}
.search-box{flex:1 1 180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 14px;min-width:0;transition:border-color .15s ease}
.search-box:focus-within{border-color:var(--accent)}
.search-box svg{flex:none;opacity:.55}
.search-box input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:16px;padding:9px 0}
.search-box input::placeholder{color:var(--dim)}
.lang-select{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--dim);font-size:13px;padding:8px 10px;cursor:pointer;max-width:130px}
.lang-select:hover{border-color:var(--accent);color:var(--text)}
.lang-select option{background:var(--surface-2);color:var(--text)}
.fav-toggle{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:14px;color:var(--dim);transition:border-color .15s ease,color .15s ease}
.fav-toggle:hover{border-color:var(--star);color:var(--text)}
.fav-toggle[aria-pressed="true"]{border-color:var(--star);color:var(--star);background:rgba(232,181,74,.08)}
.ad-slot{position:relative;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);color:var(--dim);font-size:13px;text-align:center;padding:18px 12px}
.ad-tag{position:absolute;top:8px;left:10px;font-size:10px;font-family:var(--mono);letter-spacing:.1em;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.ad-slot[data-ad-slot="top-banner"]{margin:12px 0 4px}
.ad-slot[data-ad-slot="bottom-banner"]{margin:28px 0 8px}
.layout{display:flex;gap:24px;padding-block:20px 8px}
.sidebar{width:190px;flex:none}
.side-head{font-size:12px;color:var(--dim);letter-spacing:.06em;margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--dim);transition:background .15s ease,color .15s ease;text-align:left}
.cat-btn:hover{background:var(--surface);color:var(--text)}
.cat-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cat-count{font-family:var(--mono);font-size:11px;opacity:.7}
.side-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);line-height:1.8}
.side-foot b{color:var(--accent);font-family:var(--mono);font-weight:600}
.main{flex:1;min-width:0}
.result-bar{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;font-size:13px;color:var(--dim)}
.result-bar .count{color:var(--text);font-weight:600}
.result-bar .clear{margin-left:auto;color:var(--accent);font-size:13px;padding:4px 8px;border-radius:6px}
.result-bar .clear:hover{background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0;position:relative;transition:border-color .15s ease,transform .15s ease}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:12px;min-width:0}
.card-logo{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(79,209,197,.25)}
.card-title{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title a{display:block;min-width:0}
.card-title a:hover{color:var(--accent)}
.card-desc{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;color:var(--dim);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-family:var(--mono)}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-link{font-size:13px;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.card-link:hover{text-decoration:underline}
.fav-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:color .15s ease,background .15s ease}
.fav-btn:hover{background:var(--surface-2);color:var(--star)}
.fav-btn[aria-pressed="true"]{color:var(--star)}
.ad-slot.ad-infeed{flex-direction:column;gap:6px;border-style:dashed;min-height:150px}
.ad-slot.ad-infeed .ad-size{font-family:var(--mono);font-size:11px;opacity:.75}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--dim);border:1px dashed var(--border);border-radius:var(--radius)}
.empty .reset{margin-top:14px;display:inline-block;color:var(--accent);padding:8px 18px;border:1px solid var(--accent);border-radius:999px;font-size:14px}
.empty .reset:hover{background:var(--accent-soft)}
.site-footer{border-top:1px solid var(--border);padding:20px 0 36px}
.foot-inner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--dim)}
.foot-inner a{color:var(--dim)}
.foot-inner a:hover{color:var(--accent)}
@media (max-width:768px){
  .sidebar{width:100%}
  .cat-list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .cat-btn{flex:none}
  .layout{flex-direction:column;gap:6px}
  .brand-sub{display:none}
  .lang-select{max-width:104px;font-size:12px;padding:8px}
}
@media (min-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.card:hover{transform:none}}
</style>
</head>

<script>
var LANG_ORDER=['zh-CN','zh-TW','en','ja','ko'];
var LANGS=[
  {code:'zh-CN',label:'简体中文'},
  {code:'zh-TW',label:'繁體中文'},
  {code:'en',label:'English'},
  {code:'ja',label:'日本語'},
  {code:'ko',label:'한국어'}
];
var FAV_KEY='toolnav-favs',LANG_KEY='toolnav-lang';
var state={query:'',cat:'all',favOnly:false,lang:'zh-CN'};

function ui(key){
  var d=UI[state.lang]||UI['zh-CN'];
  var v=d?d[key]:null;
  if(v==null&&UI['zh-CN'])v=UI['zh-CN'][key];
  return v==null?key:v;
}
function fmt(s,vars){
  return String(s).replace(/\{(\w+)\}/g,function(_,k){return vars[k]!=null?vars[k]:'';});
}
function li(){
  var i=LANG_ORDER.indexOf(state.lang);
  return i<0?0:i;
}
function catName(id){
  var idx=li();
  for(var i=0;i<CATS.length;i++){
    if(CATS[i].id===id){
      var n=CATS[i].n;
      return n[idx]!=null?n[idx]:n[2];
    }
  }
  return id;
}
function tagName(t){
  var a=TAGS[t];
  if(!a)return t;
  var idx=li();
  return a[idx]!=null?a[idx]:(a[2]||t);
}
function descOf(name){
  var d=DESC[state.lang];
  if(d&&d[name])return d[name];
  if(DESC['en']&&DESC['en'][name])return DESC['en'][name];
  if(DESC['zh-CN']&&DESC['zh-CN'][name])return DESC['zh-CN'][name];
  return '';
}
function getFavs(){
  try{return JSON.parse(localStorage.getItem(FAV_KEY))||[];}catch(e){return [];}
}
function saveFavs(l){try{localStorage.setItem(FAV_KEY,JSON.stringify(l));}catch(e){}}
function toggleFav(id){
  var list=getFavs(),i=list.indexOf(id);
  if(i>=0)list.splice(i,1);else list.push(id);
  saveFavs(list);
  render();
}
function filteredTools(){
  var q=state.query.trim().toLowerCase(),favs=getFavs();
  return TOOLS.filter(function(t){
    if(state.cat!=='all'&&t.cat!==state.cat)return false;
    if(state.favOnly&&favs.indexOf(t.name)<0)return false;
    if(!q)return true;
    var hay=(t.name+' '+descOf(t.name)+' '+t.tags.join(' ')+' '+t.tags.map(tagName).join(' ')).toLowerCase();
    return hay.indexOf(q)>=0;
  });
}
function applyStatic(){
  [].forEach.call(document.querySelectorAll('[data-i18n]'),function(el){
    el.textContent=ui(el.getAttribute('data-i18n'));
  });
  [].forEach.call(document.querySelectorAll('[data-i18n-ph]'),function(el){
    el.placeholder=ui(el.getAttribute('data-i18n-ph'));
  });
  [].forEach.call(document.querySelectorAll('[data-i18n-aria]'),function(el){
    el.setAttribute('aria-label',ui(el.getAttribute('data-i18n-aria')));
  });
}
function renderCats(){
  var list=[{id:'all',name:ui('all')}];
  CATS.forEach(function(c){list.push({id:c.id,name:catName(c.id)});});
  var html='';
  list.forEach(function(c){
    var n=c.id==='all'?TOOLS.length:TOOLS.filter(function(t){return t.cat===c.id;}).length;
    var on=state.cat===c.id?' aria-pressed="true"':'';
    html+='<button class="cat-btn" data-cat="'+c.id+'"'+on+' role="tab">'+
      '<span>'+c.name+'</span><span class="cat-count">'+n+'</span></button>';
  });
  document.getElementById('catList').innerHTML=html;
}
function renderGrid(){
  var list=filteredTools(),grid=document.getElementById('grid'),html='';
  list.forEach(function(t,idx){
    var fav=getFavs().indexOf(t.name)>=0;
    var letter=t.name.charAt(0).toUpperCase();
    var tags=t.tags.map(function(x){return '<span class="tag">'+tagName(x)+'</span>';}).join('');
    html+='<article class="card">'+
      '<div class="card-top">'+
        '<span class="card-logo" aria-hidden="true">'+letter+'</span>'+
        '<h3 class="card-title"><a href="'+t.url+'" target="_blank" rel="noopener">'+t.name+'</a></h3>'+
      '</div>'+
      '<p class="card-desc">'+descOf(t.name)+'</p>'+
      '<div class="card-tags">'+tags+'</div>'+
      '<div class="card-foot">'+
        '<span class="card-link"><a href="'+t.url+'" target="_blank" rel="noopener">'+ui('visit')+'</a></span>'+
        '<button class="fav-btn" data-fav="'+t.name+'" aria-pressed="'+fav+'" aria-label="'+fmt(ui('favAria'),{name:t.name})+'">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="'+(fav?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6 14.6 8.9l5.7.8-4.1 4 .9 5.7-5.1-2.7-5.1 2.7.9-5.7-4.1-4 5.7-.8z"/></svg>'+
        '</button>'+
      '</div>'+
    '</article>';
    if((idx+1)%8===0){
      html+='<div class="ad-slot ad-infeed" data-ad-slot="infeed">'+
        '<span class="ad-tag">'+ui('ad')+'</span>'+
        '<span>'+ui('adInfeed')+'</span>'+
        '<span class="ad-size">'+ui('adInfeedNote')+'</span>'+
      '</div>';
    }
  });
  if(!list.length){
    html='<div class="empty">'+ui('empty')+'<br><button class="reset" id="resetBtn">'+ui('emptyBtn')+'</button></div>';
  }
  grid.innerHTML=html;
  document.getElementById('resultBarText').innerHTML=fmt(ui('showing'),{a:'<span class="count">'+list.length+'</span>',b:TOOLS.length});
  document.getElementById('footTotal').innerHTML=fmt(ui('total'),{n:'<b>'+TOOLS.length+'</b>'});
  document.getElementById('footFav').innerHTML=fmt(ui('faved'),{n:'<b>'+getFavs().length+'</b>'});
  document.getElementById('clearBtn').hidden=!(state.query||state.cat!=='all'||state.favOnly);
}
function render(){
  renderCats();
  renderGrid();
  document.getElementById('favToggle').setAttribute('aria-pressed',state.favOnly?'true':'false');
}
function applyLang(){
  document.documentElement.lang=state.lang;
  document.title=ui('title');
  var md=document.querySelector('meta[name="description"]');
  if(md)md.setAttribute('content',ui('meta'));
  var sel=document.getElementById('langSelect');
  if(sel)sel.value=state.lang;
  applyStatic();
}
function setLang(code){
  if(!langEnabled(code))return;
  state.lang=code;
  try{localStorage.setItem(LANG_KEY,code);}catch(e){}
  applyLang();
  render();
}
function langEnabled(c){return !!c&&LANG_ORDER.indexOf(c)>=0&&!!UI[c];}
function detectLang(){
  var saved=null;
  try{saved=localStorage.getItem(LANG_KEY);}catch(e){}
  if(langEnabled(saved))return saved;
  var nav=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
  for(var i=0;i<nav.length;i++){
    var l=String(nav[i]).toLowerCase(),c=null;
    if(l.indexOf('zh')===0)c=(l.indexOf('tw')>=0||l.indexOf('hk')>=0||l.indexOf('hant')>=0)?'zh-TW':'zh-CN';
    else if(l.indexOf('en')===0)c='en';
    else if(l.indexOf('ja')===0)c='ja';
    else if(l.indexOf('ko')===0)c='ko';
    else if(l.indexOf('es')===0)c='es';
    else if(l.indexOf('fr')===0)c='fr';
    else if(l.indexOf('de')===0)c='de';
    else if(l.indexOf('pt')===0)c='pt';
    else if(l.indexOf('ru')===0)c='ru';
    if(langEnabled(c))return c;
  }
  return LANG_ORDER[0];
}
function resetFilters(){
  state.query='';state.cat='all';state.favOnly=false;
  document.getElementById('search').value='';
  render();
}
function onClick(e){
  var catBtn=e.target.closest('.cat-btn');
  if(catBtn){state.cat=catBtn.getAttribute('data-cat');render();return;}
  var favBtn=e.target.closest('.fav-btn');
  if(favBtn){toggleFav(favBtn.getAttribute('data-fav'));return;}
  if(e.target.closest('#favToggle')){state.favOnly=!state.favOnly;render();return;}
  if(e.target.closest('#clearBtn')||e.target.closest('#resetBtn')){resetFilters();}
}
function boot(){
  var sel=document.getElementById('langSelect');
  LANGS.forEach(function(l){
    var o=document.createElement('option');
    o.value=l.code;o.textContent=l.label;sel.appendChild(o);
  });
  state.lang=detectLang();
  sel.addEventListener('change',function(){setLang(this.value);});
  document.getElementById('search').addEventListener('input',function(){
    var self=this;clearTimeout(self._t);
    self._t=setTimeout(function(){state.query=self.value;render();},200);

}
boot();
